<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History</title>


<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


</head>

<body>

<div class="navbar">


<h2 class="QueueTrack">
    <img src="{{ url_for('static', filename='logo/Tqueue.png') }}" alt="Logo">
</h2>

<div class="nav-links">

    <a href="{{ url_for('admin_home') }}"
       class="nav-link {{ 'active' if request.path == url_for('admin_home') else '' }}">
        <i class="bi bi-ui-checks-grid me-3"></i> Dashboard
    </a>

    <a href="{{ url_for('queue_monitoring') }}"
       class="nav-link {{ 'active' if request.path == url_for('queue_monitoring') else '' }}">
        <i class="bi bi-people-fill me-3"></i> Queue Monitoring
    </a>

    <a href="{{ url_for('add_payment') }}"
       class="nav-link {{ 'active' if request.path == url_for('add_payment') else '' }}">
        <i class="bi bi-plus-circle me-3"></i> Add Payment
    </a>

    <a href="{{ url_for('history') }}"
       class="nav-link {{ 'active' if request.path == url_for('history') else '' }}">
        <i class="bi bi-clock-history me-3"></i> Payment History
    </a>

    <a href="{{ url_for('analytics') }}"
       class="nav-link {{ 'active' if request.path == url_for('analytics') else '' }}">
        <i class="bi bi-graph-up-arrow me-3"></i> Analytics
    </a>

    <a href="{{ url_for('logout') }}" class="nav-link">
        <i class="bi bi-box-arrow-right me-3"></i> Logout
    </a>

</div>


</div>

<div class="container">


<h1>Payment History</h1>
<p class="subtitle">List of completed payment transactions</p>

<table>
    <thead>
        <tr>
            <th>Queue #</th>
            <th>Student Name</th>
            <th>Year & Course</th>
            <th>Teller #</th>
            <th>Amount Paid</th>
            <th>Remaining Balance</th>
            <th>Payment Method</th>
            <th>Date & Time</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="paymentHistoryBody">
        <!-- Payment records will be loaded here -->
    </tbody>
</table>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='payment_history.js') }}"></script>

</body>
</html>
