<!DOCTYPE html>
<html>

<head>
    <title>Queue Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Optional Bootstrap JS (for modals, dropdowns, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="navbar">

        <h2 class="QueueTrack">
            
    <img src="{{ url_for('static', filename='logo/Tqueue.png')}}" alt="Logo">
</h2>

        <div class="nav-links">
    <a href="{{ url_for('admin_home') }}" class="nav-link {{ 'active' if request.path == url_for('admin_home') else '' }} mb-3 d-flex align-items-center">
    <i class="bi bi-ui-checks-grid me-3"></i> Dashboard
</a>

<a href="{{ url_for('queue_monitoring') }}" class="nav-link {{ 'active' if request.path == url_for('queue_monitoring') else '' }} mb-3 d-flex align-items-center">
    <i class="bi bi-people-fill me-3"></i> Queue Monitoring
</a>

<a href="{{ url_for('analytics') }}" class="nav-link {{ 'active' if request.path == url_for('analytics') else '' }} mb-3 d-flex align-items-center">
    <i class="bi bi-graph-up-arrow me-3"></i> Analytics
</a>

<a href="{{ url_for('add_payment') }}" class="nav-link {{ 'active' if request.path == url_for('add_payment') else '' }} mb-3 d-flex align-items-center">
    <i class="bi bi-plus-circle me-3"></i> Add Payment
</a>

<a href="{{ url_for('logout') }}" class="nav-link mb-3 d-flex align-items-center">
    <i class="bi bi-box-arrow-right me-3"></i> Logout
</a>
        </div>

    </div>

    <div class="container">

        <h1>Queue Monitoring</h1>
        <p class="subtitle">Manage student queue and payment status</p>


        <div class="table-container">

            <h2>Queue List (<span id="queueCount">0</span>)</h2>

            <table>
                
                <thead>
                    <tr>
                        <th>Teller #</th>
                        <th>Queue #</th>
                        <th>Student Name</th>
                        <th>Year & Course</th>
                        <th>Status</th>
                        <th>Amount</th>
                        <th>Timestamp</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="queueBody">
                    <!-- Rows will be inserted dynamically -->
                </tbody>
            </table>

        </div>

    </div>

    <script src="{{ url_for('static', filename='queueM.js') }}"></script>

</body>

</html>
